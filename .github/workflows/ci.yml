name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.5
          cache: false
      - name: Bootstrap candidate-owned pinned graphs
        run: make tools-bootstrap
      - name: Verify standalone release boundary offline
        env:
          GOPROXY: "off"
          GOSUMDB: "off"
          GOTOOLCHAIN: local
          GOWORK: "off"
        run: make verify-release

  cross-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: arm64
          - goos: darwin
            goarch: arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.5
      - name: Cross-build packages
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath ./...

  required:
    name: Required CI
    if: ${{ always() }}
    needs: [verify, cross-build]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require every CI job to succeed
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          CROSS_BUILD_RESULT: ${{ needs.cross-build.result }}
        run: |
          test "$VERIFY_RESULT" = "success"
          test "$CROSS_BUILD_RESULT" = "success"
