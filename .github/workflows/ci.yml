name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.5
          cache-dependency-path: |
            go.sum
            tools/go.sum
            tools/actionlint/go.sum
            testdata/annotationapp/go.sum
            testdata/annotationfixture/go.sum
      - name: Verify standalone boundary
        run: go run ./internal/boundarygate/cmd -mode=verify

  cross-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: arm64
          - goos: darwin
            goarch: arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.5
      - name: Cross-build packages
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath ./...

  required:
    name: Required CI
    if: ${{ always() }}
    needs: [verify, cross-build]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require every CI job to succeed
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          CROSS_BUILD_RESULT: ${{ needs.cross-build.result }}
        run: |
          test "$VERIFY_RESULT" = "success"
          test "$CROSS_BUILD_RESULT" = "success"
