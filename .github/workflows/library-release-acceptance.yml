name: library release cross-producer acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/library-release-acceptance.yml"
      - "Makefile"
      - "README.md"
      - "RELEASING.md"
      - "cmd/spice-library-release-verify/**"
      - "internal/libraryreleaseacceptance/**"
      - "internal/libraryreleaseverify/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/library-release-acceptance.yml"
      - "Makefile"
      - "README.md"
      - "RELEASING.md"
      - "cmd/spice-library-release-verify/**"
      - "internal/libraryreleaseacceptance/**"
      - "internal/libraryreleaseverify/**"

permissions:
  contents: read

concurrency:
  group: library-release-acceptance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross-producer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache: false
      - name: Run exact-pinned cross-producer proof
        env:
          GOFLAGS: -mod=vendor
          GOPROXY: "off"
          GOTOOLCHAIN: local
          GOWORK: "off"
        run: go run -mod=vendor ./internal/libraryreleaseacceptance/cmd

  required:
    name: Required CI
    if: ${{ always() }}
    needs: [cross-producer]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require cross-producer acceptance to succeed
        env:
          CROSS_PRODUCER_RESULT: ${{ needs.cross-producer.result }}
        run: test "$CROSS_PRODUCER_RESULT" = "success"
