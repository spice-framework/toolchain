name: library release cross-producer acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/library-release-acceptance.yml"
      - "Makefile"
      - "README.md"
      - "RELEASING.md"
      - "cmd/spice-library-release-verify/**"
      - "internal/libraryreleaseacceptance/**"
      - "internal/libraryreleaseverify/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/library-release-acceptance.yml"
      - "Makefile"
      - "README.md"
      - "RELEASING.md"
      - "cmd/spice-library-release-verify/**"
      - "internal/libraryreleaseacceptance/**"
      - "internal/libraryreleaseverify/**"

permissions:
  contents: read

concurrency:
  group: library-release-acceptance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross-producer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.5
          cache: false
      - name: Run exact-pinned cross-producer proof
        env:
          GOFLAGS: -mod=vendor
          GOPROXY: "off"
          GOTOOLCHAIN: local
          GOWORK: "off"
        run: go run -mod=vendor ./internal/libraryreleaseacceptance/cmd
